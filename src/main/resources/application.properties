# Puerto en el que corre este microservicio
server.port=8082
spring.application.name=juegos-service

# --- Conexion a MySQL ---
# Antes de correr la app, crea la base de datos con: CREATE DATABASE juegos_db;
spring.datasource.url=jdbc:mysql://localhost:3306/juegos_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
